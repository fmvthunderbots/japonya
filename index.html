<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#d32f2f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Japonya Gezisi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #2c3e50;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            position: relative;
        }
        header {
            background-color: #d32f2f;
            color: white;
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 1px;
        }
        header p {
            margin: 10px 0 0 0;
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .currency-toggle-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            user-select: none;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .currency-toggle-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .currency-content {
            display: none;
            background-color: rgba(0, 0, 0, 0.2);
            margin: 20px auto 0 auto;
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .currency-inputs {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .currency-inputs input {
            padding: 8px;
            border: none;
            border-radius: 4px;
            width: 80px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
        .currency-inputs span {
            font-weight: bold;
            font-size: 1.1em;
        }
        .currency-rate-info {
            font-size: 0.8em;
            opacity: 0.9;
        }

        .select-container {
            padding: 20px;
            background-color: #f1f3f5;
            text-align: center;
            border-bottom: 2px solid #dee2e6;
        }
        .select-container label {
            font-size: 1.1em;
            font-weight: 600;
            color: #495057;
            display: block;
            margin-bottom: 12px;
        }
        .controls-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
